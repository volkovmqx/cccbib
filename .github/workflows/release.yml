# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build & Release

on:
  push:
    branches:
      - '!*'
    tags:
      - 'v*.*'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build-and-release:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: yarn install --frozen-lockfile
      - run: yarn run build

      # On some Node versions (the one in .nvmrc too) ares-package writes every file date as 1970 and webOS refuses to install such an ipk
      - name: Use Node.js 20 for packaging
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: yarn run package
      - name: Check that the ipk keeps real file dates
        run: |
          if ar p org.webosbrew.cccbib_*_all.ipk data.tar.gz | tar tvz | grep -q ' 1970-01-01 '; then
            echo 'The ipk has files dated 1970 and webOS refuses to install it'
            exit 1
          fi
      - run: echo RELEASE_FILENAME_IPK=`ls *.ipk` >> $GITHUB_ENV
      - run: yarn manifest

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            ${{github.workspace}}/${{env.RELEASE_FILENAME_IPK}}
            ${{github.workspace}}/org.webosbrew.cccbib.manifest.json
        id: upload-ipk-asset
